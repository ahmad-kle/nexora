<style>
:root{--bg:#050B1A;--s:#0A1530;--s2:#0e1d40;--b:#1685FF;--b2:#42B7FF;--w:#fff;--m:#9fb0cc;--line:rgba(66,183,255,.18);--r:18px;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px;height:auto}
body{background:var(--bg);color:var(--w);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.7;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 20% 10%,rgba(22,133,255,.22),transparent 70%),radial-gradient(50% 40% at 90% 60%,rgba(66,183,255,.10),transparent 70%),linear-gradient(rgba(66,183,255,.04) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(66,183,255,.04) 1px,transparent 1px) 0 0/48px 48px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--b2);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:96px 0}
h1,h2,h3{line-height:1.25}
h2{font-size:clamp(1.7rem,4vw,2.6rem);margin-bottom:12px}
.lead{color:var(--m);max-width:620px}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.08em;color:var(--b2);border:1px solid var(--line);border-radius:99px;padding:2px 12px;background:rgba(22,133,255,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:99px;font:600 1rem inherit;font-family:inherit;border:1px solid var(--line);color:var(--w);background:rgba(255,255,255,.04);cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--b),var(--b2));border:0;color:#04122c;box-shadow:0 8px 30px rgba(22,133,255,.4)}
.btn.p:hover{box-shadow:0 12px 40px rgba(66,183,255,.55)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px)}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#intro.done{opacity:0;visibility:hidden}
#intro .beam{position:absolute;top:50%;height:2px;width:0;inset-inline-start:0;background:linear-gradient(90deg,transparent,var(--b2),transparent);box-shadow:0 0 24px var(--b2);animation:beam 1.8s ease-out forwards}
#intro .mark{font:700 clamp(2rem,9vw,4rem)/1 'IBM Plex Sans Arabic',sans-serif;letter-spacing:.3em;direction:ltr;opacity:0;filter:blur(12px);animation:rev 1.4s .7s forwards}
#intro button{position:absolute;bottom:28px;inset-inline:0;margin:auto;width:max-content;background:none;border:0;color:var(--m);font:inherit;cursor:pointer;padding:12px}
@keyframes beam{to{width:100%}}
@keyframes rev{to{opacity:1;filter:none}}
/* nav */
header{position:fixed;top:0;inset-inline:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
header.s{background:rgba(5,11,26,.82);backdrop-filter:blur(14px);border-color:var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}

faq:[[["كم تكلفة تصميم موقع إلكتروني؟","التكلفة تختلف حسب نوع المشروع وحجمه ومميزاته، ولهيك ما في سعر ثابت. احكيلنا عن فكرتك وبنحدد لك التكلفة بعد فهم التفاصيل."],["كم يستغرق تنفيذ المشروع؟","المدة بتتحدد حسب نطاق المشروع ومتطلباته، وبنتفق عليها معك قبل البدء."],["هل يمكن تطوير متجر إلكتروني مخصص؟","نعم، نطوّر متاجر تعرض منتجاتك وتناسب طريقة الطلب عندك، ونحدد الميزات معك."],["هل يمكن تعديل الموقع بعد تسليمه؟","نعم، يمكن الاتفاق على تعديلات أو دعم لاحق بحسب احتياج المشروع."],["هل يمكن تطوير لوحة تحكم لإدارة الموقع؟","نعم، نطوّر لوحات تحكم وأنظمة إدارة مخصصة بحسب ما يحتاجه عملك."],["هل المواقع تعمل على الهواتف؟","نعم، نصمم المواقع لتعمل بشكل متجاوب على الهواتف والأجهزة اللوحية والكمبيوتر."],["كيف أبدأ بطلب مشروع؟","عبّي نموذج «ابدأ مشروعك» وراح تنفتح عندك محادثة واتساب برسالة جاهزة، اضغط إرسال وبنكمل النقاش."],["هل يمكن تطوير أدوات ويب وبرمجيات مخصصة؟","نعم، نطوّر أدوات ويب تفاعلية وبرمجيات مخصصة بحسب فكرتك ونطاق العمل المتفق عليه."]],

const ICONS=['<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>','<path d="M6 7h12l-1 12H7zM9 7a3 3 0 016 0"/>','<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 15l3-4 3 2 4-5"/>','<path d="M14 7l3-3 3 3-3 3M3 21l9-9M12 12l2 2"/>','<path d="M4 6h16M4 12h10M4 18h6"/>','<path d="M20 12a8 8 0 11-3-6M20 4v5h-5"/>'];
const CI={wa:'<path d="M4 20l1.3-4A8 8 0 118 19z"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>',link:'<path d="M10 14a4 4 0 005 0l3-3a4 4 0 00-5-5l-1 1M14 10a4 4 0 00-5 0l-3 3a4 4 0 005 5l1-1"/>'};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
let L=0,cat="all",cartN=0,step=0,busy=false,waUrl="";
const D={type:-1,svc:new Set(),goal:-1};
const t=k=>T[k][L],esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg=(p,c="ic")=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
function renderLogo(){['logo','flogo'].forEach(id=>{$('#'+id).innerHTML=CONFIG.logo?`<img src="${esc(CONFIG.logo)}" alt="NEXORA" width="52" height="52">`:'<span>NEXORA</span>'});if(CONFIG.logo)$('#im').innerHTML=`<img src="${esc(CONFIG.logo)}" alt="NEXORA" style="width:min(66vw,380px);height:auto;border-radius:50%">`}
function renderServices(){
 $('#svc').innerHTML=[0,1,2,3,4,5].map(i=>`<article class="card glass">${svg(ICONS[i])}<h3>${t('s'+i+'t')}</h3><p>${t('s'+i+'d')}</p><button class="more" aria-expanded="false" aria-controls="x${i}">${t('disc')}</button><div class="extra" id="x${i}">${t('s'+i+'x')}</div><div class="pact"><a class="btn" href="#start" data-svc="${i}">${t('req')}</a></div></article>`).join('');
 $$('.more').forEach(b=>b.onclick=()=>{const o=document.getElementById(b.getAttribute('aria-controls')).classList.toggle('o');b.setAttribute('aria-expanded',o)});
 $$('[data-svc]').forEach(a=>a.onclick=()=>{D.svc.add(+a.dataset.svc);renderForm()});
}
function renderWork(){
 const cs=Object.keys(CATS).filter(c=>PROJECTS.some(p=>p.cat===c));
 $('#flt').innerHTML=[['all',t('all')],...cs.map(c=>[c,CATS[c][L]])].map(([k,n])=>`<button type="button" data-c="${k}" aria-pressed="${k===cat}">${n}</button>`).join('');
 $$('#flt button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderWork()});
 $('#pf').innerHTML=PROJECTS.filter(p=>cat==='all'||p.cat===cat).map(p=>{const d=p[L?'en':'ar']||p.ar,nm=L&&p.nameEn?p.nameEn:p.name,f=(d.features||[]);
  return `<article class="card glass"><span class="live">${t('liveb')}</span><div class="pimg">${p.image?`<img src="${esc(p.image)}" alt="${esc(nm)}" loading="lazy">`:`<b aria-hidden="true">${esc((p.nameEn||nm)[0])}</b>`}</div><span class="tag">${CATS[p.cat]?CATS[p.cat][L]:CATS.other[L]}</span><h3 style="margin-top:10px">${esc(nm)}</h3><p>${esc(d.desc)}</p>${f.length?`<div class="extra" id="d-${esc(p.id)}"><ul class="ft">${f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="pact"><a class="btn p" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${t('prev')} ↗</a>${f.length?`<button class="btn" type="button" data-d="d-${esc(p.id)}" aria-expanded="false">${t('det')}</button>`:''}</div></article>`}).join('');
 $$('[data-d]').forEach(b=>b.onclick=()=>{const o=document.getElementById(b.dataset.d).classList.toggle('o');b.setAttribute('aria-expanded',o)});
}
function renderMisc(){
 $('#prods').innerHTML=t('pn').map(n=>`<div class="prod"><div class="img"></div><b>${n}</b><br><small style="color:var(--m)">${t('price')}</small><br><button class="btn" type="button" style="min-height:38px;padding:0 14px;margin-top:8px;font-size:.85rem" data-cart>${t('add')}</button></div>`).join('');
 $$('[data-cart]').forEach(b=>b.onclick=()=>{$('#cn').textContent=++cartN});
 $('#why6').innerHTML=t('w').map((w,i)=>`<div class="card glass">${svg(ICONS[[0,4,2,5,3,1][i]])}<h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('');
 $('#faqs').innerHTML=t('faq').map(q=>`<details class="q"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
}
function renderForm(){
 const mk=(id,list,multi)=>{$('#'+id).innerHTML=list.map((x,i)=>`<button type="button" class="opt" data-i="${i}" aria-pressed="${multi?D.svc.has(i):D[id==='o0'?'type':'goal']===i}">${x}</button>`).join('');
  $$('#'+id+' .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(multi)D.svc.has(i)?D.svc.delete(i):D.svc.add(i);else D[id==='o0'?'type':'goal']=i;$('#e'+id[1]).textContent='';renderForm()})};
 mk('o0',t('ot'));mk('o1',[0,1,2,3,4,5].map(i=>t('s'+i+'t')),true);mk('o2',t('og'));
 $$('[data-s]').forEach(e=>e.hidden=e.dataset.s!=step);$$('.dots i').forEach((d,i)=>d.classList.toggle('on',i<=step));
 $('#bk').hidden=step==0;$('#nx').textContent=step==4?(busy?t('busy'):t('send')):t('next');$('#nx').disabled=busy;
 if(step==4)$('#rv').textContent=msg();
}
const val=()=>{
 if(step==0&&D.type<0){$('#e0').textContent=t('e1');return false}
 if(step==1&&!D.svc.size){$('#e1').textContent=t('e2');return false}
 if(step==2&&D.goal<0){$('#e2').textContent=t('e3');return false}
 if(step==3){let ok=true;const f=(id,e,c,k)=>{const v=$(id).value.trim();$(e).textContent=c(v)?'':t(k);if(!c(v))ok=false};
  f('#nm','#e3a',v=>v.length>=2,'e4');f('#ct','#e3b',v=>/^\+?[\d\s-]{7,}$/.test(v)||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v),'e5');f('#ds','#e3c',v=>v.length>=10,'e6');return ok}
 return true};
function msg(){const v=id=>$(id).value.trim(),line=(k,x)=>x?`\n▪ ${t(k)}: ${x}`:'';
 return t('m0')+'\n'+line('m1',t('ot')[D.type])+line('m2',[...D.svc].sort().map(i=>t('s'+i+'t')).join(L?', ':'، '))+line('m3',t('og')[D.goal])+line('m4',v('#nm'))+line('m5',v('#bn'))+line('m6',v('#ct'))+line('m7',v('#ds'))+line('m8',v('#bd'))+line('m9',v('#tm'))}
$('#bk').onclick=()=>{step--;renderForm()};
$('#nx').onclick=()=>{if(busy||!val())return;if(step<4){step++;renderForm();$('#st').scrollIntoView({block:'nearest'});return}
 waUrl=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg())}`;
 window.open(waUrl,'_blank','noopener');busy=true;renderForm();
 $('#ok').innerHTML=`${t('okm')}<a href="${waUrl}" target="_blank" rel="noopener">${t('okl')}</a>`;
 setTimeout(()=>{busy=false;renderForm()},2500)};
function renderContacts(){
 const C=[];CONFIG.whatsapp&&C.push(['WhatsApp','https://wa.me/'+CONFIG.whatsapp,'wa','+'+CONFIG.whatsapp.replace(/^(\d{3})(\d{3})(\d{3})(\d+)$/,'$1 $2 $3 $4')]);
 CONFIG.email&&C.push([CONFIG.email,'mailto:'+CONFIG.email,'mail',CONFIG.email]);
 CONFIG.instagram&&C.push(['Instagram',CONFIG.instagram,'ig','@'+CONFIG.instagram.split('/').filter(Boolean).pop()]);
 CONFIG.tiktok&&C.push(['TikTok',CONFIG.tiktok,'link','TikTok']);(CONFIG.other||[]).forEach(o=>C.push([o.label,o.url,'link',o.label]));
 const h=C.map(c=>`<a href="${esc(c[1])}" ${c[1].startsWith('http')?'target="_blank" rel="noopener noreferrer"':''} aria-label="${esc(c[0])}">${svg(CI[c[2]],'')}<span class="ltr">${esc(c[3])}</span></a>`).join('');
 $('#cts').innerHTML=h;$('#soc').innerHTML=h;
}
function applyLang(l,save){
 L=l;const d=document.documentElement;d.lang=L?'en':'ar';d.dir=L?'ltr':'rtl';
 if(save)try{localStorage.setItem('nexora-lang',L?'en':'ar')}catch(e){}
 document.title=t('title');$('meta[name=description]').content=t('md');$('meta[property="og:title"]').content=t('title');$('meta[property="og:description"]').content=t('md');$('meta[property="og:locale"]').content=L?'en_US':'ar_AR';
 $$('[data-i]:not(.opt)').forEach(e=>{if(T[e.dataset.i])e.textContent=t(e.dataset.i)});
 $$('#lg,#lg2').forEach(b=>{b.textContent=t('lg');b.setAttribute('aria-label',L?'التبديل إلى العربية':'Switch to English');b.lang=L?'ar':'en'});
 $('#cp').textContent='© '+new Date().getFullYear()+' NEXORA';
 renderServices();renderWork();renderMisc();renderForm();renderContacts();
}
$$('#lg,#lg2').forEach(b=>b.onclick=()=>applyLang(L?0:1,true));
/* tabs / nav / reveal / intro */
$$('.tabs button[data-p]').forEach(b=>b.onclick=()=>{$$('.tabs button[data-p]').forEach(x=>x.setAttribute('aria-selected',x===b));$$('.pane').forEach((p,i)=>p.classList.toggle('on',i==b.dataset.p))});
const hd=$('#hd');addEventListener('scroll',()=>hd.classList.toggle('s',scrollY>30),{passive:true});
const dr=$('#drawer'),bg=$('#bg'),tog=o=>{dr.classList.toggle('o',o);bg.setAttribute('aria-expanded',o)};
bg.onclick=()=>tog(true);$('#cl').onclick=()=>tog(false);$$('#drawer a').forEach(a=>a.onclick=()=>tog(false));addEventListener('keydown',e=>e.key==='Escape'&&tog(false));
const links=$$('#links a'),so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-40% 0px -55% 0px'});
['home','services','work','why','contact'].forEach(id=>so.observe(document.getElementById(id)));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});
$$('.rv,#steps').forEach(e=>io.observe(e));
const intro=$('#intro'),end=()=>intro.classList.add('done');$('#skip').onclick=end;setTimeout(end,2800);
/* init */
renderLogo();
let sl=null;try{sl=localStorage.getItem('nexora-lang')}catch(e){}
applyLang(sl==='en'?1:0,false);
fetch('projects.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{if(Array.isArray(d)&&d.length){PROJECTS=d;renderWork()}}).catch(()=>{});
</script>
